<!-- A penguin silhouette (original drawing) for hearth's menu bar (monochrome). FILL is replaced at runtime. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <mask id="m">
      <rect width="100" height="100" fill="#fff"/>
      <!-- belly and eyes cut out -->
      <ellipse cx="50" cy="66" rx="17" ry="22" fill="#000"/>
      <ellipse cx="43.5" cy="24" rx="4" ry="5.5" fill="#000"/>
      <ellipse cx="56.5" cy="24" rx="4" ry="5.5" fill="#000"/>
    </mask>
  </defs>
  <g fill="FILL">
    <g mask="url(#m)">
      <!-- head and body -->
      <ellipse cx="50" cy="27" rx="17" ry="20"/>
      <path d="M33 34 C 22 52, 16 70, 22 84 C 30 92, 70 92, 78 84 C 84 70, 78 52, 67 34 Z"/>
    </g>
    <!-- beak -->
    <path d="M43 31 Q 50 27 57 31 Q 50 38 43 31 Z"/>
    <!-- eye pupils -->
    <circle cx="44.5" cy="25" r="1.8"/>
    <circle cx="55.5" cy="25" r="1.8"/>
    <!-- feet -->
    <path d="M22 86 C 22 80, 34 80, 40 88 C 42 94, 24 96, 22 86 Z"/>
    <path d="M78 86 C 78 80, 66 80, 60 88 C 58 94, 76 96, 78 86 Z"/>
  </g>
</svg>
