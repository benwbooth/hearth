# Ryubing (the Ryujinx fork) is Avalonia on XWayland, with no accessibility
# tree or menu export. This mirrors its Options/Actions menu items that have
# a default key (upstream src/Ryujinx/UI/Views/Main/MainMenuBarView.axaml,
# Window.KeyBindings in UI/Windows/MainWindow.axaml) plus the default
# in-game hotkeys (Systems/Configuration/ConfigurationState.cs; labels from
# assets/locales.json). The hotkeys and Actions items work while a game runs.
schema: hearth-menu-module/1
id: Ryujinx
version: 1
app:
  match:
    app_id: [Ryujinx, ryujinx, Ryujinx.sh, org.ryujinx.Ryujinx]
    desktop: [Ryujinx.desktop]
    flatpak: [org.ryujinx.Ryujinx]
    nixpkgs: [ryubing]
  versions: ">=1.2"
  locales: [en]
provenance:
  generator: hand-written from upstream source (Ryubing 1.3.3, MainMenuBarView.axaml, MainWindow.axaml, ConfigurationState.cs, locales.json, 2026-11-24)
  inputs: [source:MainMenuBarView.axaml, source:MainWindow.axaml, source:ConfigurationState.cs]
menus:
  - title: Options
    items:
      - { label: Toggle Fullscreen, shortcut: F11, do: { keys: F11 } }
  - title: Actions
    items:
      - { label: Pause / Resume, shortcut: F5, do: { keys: F5 } }
      - { label: Stop Emulation, shortcut: Escape, do: { keys: Escape } }
      - separator
      - { label: Scan Amiibo, shortcut: Ctrl+A, do: { keys: Ctrl+A } }
      - { label: Scan Amiibo (.BIN), shortcut: Ctrl+B, do: { keys: Ctrl+B } }
      - { label: Take Screenshot, shortcut: F8, do: { keys: F8 } }
      - { label: Hide UI, shortcut: F4, do: { keys: F4 } }
      - separator
      - { label: Toggle Docked Mode, shortcut: F9, do: { keys: F9 } }
      - { label: Toggle VSync Mode, shortcut: F1, do: { keys: F1 } }
      - { label: Mute, shortcut: F2, do: { keys: F2 } }
