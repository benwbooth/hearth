      - { label: 3D Viewport, shortcut: Shift+F5, do: { keys: Shift+F5 } }
      - { label: Graph Editor / Drivers, shortcut: Shift+F6, do: { keys: Shift+F6 } }
      - { label: Properties, shortcut: Shift+F7, do: { keys: Shift+F7 } }
      - { label: Video Sequencer, shortcut: Shift+F8, do: { keys: Shift+F8 } }
      - { label: Outliner, shortcut: Shift+F9, do: { keys: Shift+F9 } }
      - { label: Image/UV Editor, shortcut: Shift+F10, do: { keys: Shift+F10 } }
      - { label: Text Editor, shortcut: Shift+F11, do: { keys: Shift+F11 } }
