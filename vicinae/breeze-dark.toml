# Breeze Dark for Vicinae, matching hearth's Theme.qml.
[meta]
name = "Breeze Dark"
description = "KDE Breeze Dark colours"
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
accent = "#3daee9"
accent_foreground = "#fcfcfc"
background = "#202326"
foreground = "#fcfcfc"
secondary_background = "#292c30"
border = "#3f444a"

[colors.main_window]
border = "#3f444a"

[colors.settings_window]
border = "#3f444a"

[colors.accents]
blue = "#3daee9"
green = "#27ae60"
magenta = "#9b59b6"
orange = "#f67400"
red = "#da4453"
yellow = "#fdbc4b"
cyan = "#1abc9c"
purple = "#9b59b6"

[colors.text]
default = "#fcfcfc"
muted = "#a1a9b1"
danger = "#da4453"
success = "#27ae60"
placeholder = "#7f8c8d"
selection = { background = "#3daee9", foreground = "#fcfcfc" }

[colors.text.links]
default = "#3daee9"
visited = "#9b59b6"

[colors.input]
border = "#3f444a"
border_focus = "#3daee9"
border_error = "#da4453"
